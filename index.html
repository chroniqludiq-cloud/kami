/* V5 — hero plus panoramique, navigation lisible, transition brumeuse */
.hero {
  position: relative;
  min-height: auto !important;
  height: auto !important;
  aspect-ratio: 1536 / 768;
  background-size: cover !important;
  background-position: center center !important;
  overflow: hidden;
}

/* Voile très léger derrière la zone de navigation */
.hero::before {
  content: "";
  position: absolute;
  z-index: 1;
  inset: 0 0 auto 0;
  height: 105px;
  background: linear-gradient(
    to bottom,
    rgba(236,244,235,.76) 0%,
    rgba(236,244,235,.38) 52%,
    rgba(236,244,235,0) 100%
  );
  pointer-events: none;
}

/* L'image se fond dans le vert brumeux de la page */
.hero::after {
  content: "";
  position: absolute;
  z-index: 1;
  left: 0; right: 0; bottom: 0;
  height: 18%;
  background: linear-gradient(
    to bottom,
    rgba(239,246,239,0) 0%,
    rgba(239,246,239,.18) 35%,
    rgba(239,246,239,.58) 72%,
    rgba(239,246,239,.96) 100%
  );
  pointer-events: none;
}

.hero > * {
  position: relative;
  z-index: 2;
}

.hero nav, .hero header, .nav, nav {
  text-shadow: 0 1px 7px rgba(247,250,244,.95);
}

@media (max-width: 800px) {
  .hero {
    aspect-ratio: 1536 / 860;
    background-size: cover !important;
    background-position: center center !important;
  }
  .hero::before { height: 92px; }
  .hero::after { height: 22%; }
}


/* V6 — transitions brumeuses entre les plages de couleur */
main section,
section {
  position: relative;
  isolation: isolate;
}

main section::before,
section::before {
  content: "";
  position: absolute;
  z-index: 0;
  pointer-events: none;
  left: 0; right: 0; top: 0;
  height: 42px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.34) 0%,
    rgba(242,248,242,.18) 38%,
    rgba(242,248,242,0) 100%
  );
}

main section::after,
section::after {
  content: "";
  position: absolute;
  z-index: 0;
  pointer-events: none;
  left: 0; right: 0; bottom: 0;
  height: 52px;
  background: linear-gradient(
    to bottom,
    rgba(242,248,242,0) 0%,
    rgba(242,248,242,.16) 55%,
    rgba(255,255,255,.32) 100%
  );

/* 1 — une petite main de cartes classiques */
.hand-cards .c{

}
.draw-card .waterline{

  border-radius:50%;
}

.melds{width:82px}
.melds i{
