<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kami — statistiques</title><style>
:root{--g:#35533b;--sage:#e7efe3;--paper:#f8faf5;--ink:#304437}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#f5f9f2,#e5eee1);color:var(--ink)}main{max-width:860px;margin:auto;padding:42px 18px 70px}h1{font:48px Georgia,serif;color:var(--g);margin:0 0 8px}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:28px}.card{background:rgba(255,255,255,.78);border:1px solid #d8e4d5;border-radius:16px;padding:18px;box-shadow:0 8px 26px rgba(49,79,55,.07)}.n{font:34px Georgia,serif;color:var(--g)}.label{margin-top:5px}.small{font-size:13px;color:#647668;margin-top:6px}.links{margin-top:24px;font-size:13px}.links a{color:var(--g)}@media(max-width:560px){.grid{grid-template-columns:1fr}h1{font-size:38px}}</style></head><body><main><h1>Kami</h1><p>Statistiques simples du site. Les « consultations » des règles correspondent à un clic sur le bouton du PDF, pas à une mesure du temps de lecture.</p><div class="grid" id="grid"></div><p class="small">Comptage anonyme sans cookie, via CounterAPI. Les compteurs commencent à partir de la mise en ligne de cette version.</p><p class="links"><a href="./">← Retour au site Kami</a></p></main><script>
const NS='chroniqludiq-cloud.github.io';
const items=[['kami-view','home','Visites du site'],['kami-rules','en','Règles anglaises'],['kami-rules','fr','Règles françaises'],['kami-rules','ja','Règles japonaises'],['kami-aid','en','Aide de jeu EN'],['kami-aid','fr','Aide de jeu FR'],['kami-aid','ja','Aide de jeu JP']];
const grid=document.getElementById('grid');
for(const [a,k,l] of items){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="n">—</div><div class="label">${l}</div><div class="small"><a target="_blank" rel="noopener" href="https://counterapi.com/stats/${NS}/${a}/${k}">détails</a></div>`;grid.appendChild(d);fetch(`https://counterapi.com/api/${NS}/${a}/${k}?readOnly=true&noFormatting=true`,{cache:'no-store'}).then(r=>r.json()).then(x=>d.querySelector('.n').textContent=x.value??0).catch(()=>d.querySelector('.n').textContent='?');}
</script></body></html>
